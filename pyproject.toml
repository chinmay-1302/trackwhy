[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trackwhy"
version = "1.0.0"
description = "TrackWhy: attributor, annotations, and analysis for MOT20 tracking failures"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Chinmay Mhatre" },
  { name = "Sankalp Gawali" },
  { name = "Punit Rathore" },
]
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
attributor = [
  "matplotlib>=3.7",
  "opencv-python>=4.8",
  "trackeval>=1.3",
]
test = ["pytest>=7"]

[project.scripts]
trackwhy-mine = "attributor.mine_events:main"
trackwhy-tables = "analysis.tables:main"

[tool.setuptools.packages.find]
include = ["attributor*", "analysis*", "renderer*", "mot_error_attribution*"]
